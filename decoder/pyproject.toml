[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-gnewsdecoder"
version = "0.1.0"
description = "Function-level googlenewsdecoder replacement backed by hiver on Apify"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = "MIT"

[tool.setuptools]
py-modules = ["hiver_gnewsdecoder", "decode_links"]
